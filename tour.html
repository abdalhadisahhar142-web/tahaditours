<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Roboto+Slab:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Tour – Al Tahadi Travel & Tours</title>
  <meta name="description" content="Tour details, itinerary and booking with Al Tahadi Travel & Tours." />
</head>
<body data-page="tour">
  <div id="site-header"></div>

  <section class="page-hero tour-hero" id="tourHero">
    <div class="container">
      <p class="crumbs"><a href="index.html">Home</a> / <a href="tours.html">Tours</a></p>
      <span class="eyebrow" id="tourType"></span>
      <h1 class="h-lg" id="tourTitle" style="max-width:900px"></h1>
      <div class="tour-meta" id="tourMeta"></div>
    </div>
  </section>

  <section class="section" style="padding-top:60px">
    <div class="container tour-layout">
      <div id="tourBody"></div>

      <aside class="book-card">
        <h3>Book this tour</h3>
        <p>Send us your details and our team will confirm availability and price.</p>
        <form class="form" data-mail="Booking request">
          <input type="hidden" name="Tour" id="bookTour" />
          <div class="field"><label for="bName">Full name</label><input id="bName" name="Name" required /></div>
          <div class="field"><label for="bPhone">Phone / WhatsApp</label><input id="bPhone" name="Phone" type="tel" required /></div>
          <div class="field"><label for="bDate">Travel date</label><input id="bDate" name="Date" type="date" /></div>
          <div class="field"><label for="bPax">Travellers</label>
            <select id="bPax" name="Travellers"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5+</option></select></div>
          <button class="btn btn--solid">Send request
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h15M14 6l6 6-6 6"/></svg></button>
          <p class="form__msg"></p>
        </form>
        <div class="book-card__contact">
          <a href="tel:+963113338769"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg><span dir="ltr">+963-11-3338769</span></a>
          <a href="mailto:info@tahaditours.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></svg>info@tahaditours.com</a>
        </div>
      </aside>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container">
      <div class="section-head reveal"><div><h2 class="h-md">You may also like</h2></div>
        <a href="tours.html" class="link-all">All tours
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h15M14 6l6 6-6 6"/></svg></a></div>
      <div class="tours-grid" id="relatedTours"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
